name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  packages: write
concurrency:
  group: flix.ldmax.nl-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE_REPO: ghcr.io/mightymax/erfgoedflix-app
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_REPO }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/mightymax/ErfgoedFlix
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update release branch
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout -B release
          if git rev-parse --verify origin/release >/dev/null 2>&1; then
            git restore --source=origin/release --staged --worktree .github/workflows
          fi
          python3 - <<'PYTHON'
          from pathlib import Path
          import os
          path = Path("infrastructure/overlays/prod/kustomization.yaml")
          content = path.read_text()
          prefix, marker, _ = content.partition("    newTag:")
          if not marker:
              raise SystemExit("Missing image newTag")
          path.write_text(prefix + "    newTag: " + os.environ["GITHUB_REF_NAME"] + "\n    digest: " + os.environ["IMAGE_DIGEST"] + "\n")
          PYTHON
          kubectl kustomize infrastructure/overlays/prod > /tmp/release-manifests.yaml
          git add infrastructure/overlays/prod/kustomization.yaml
          git commit -m "release: ${GITHUB_REF_NAME}"
          git push --force origin HEAD:release
